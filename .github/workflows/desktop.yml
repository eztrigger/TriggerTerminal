name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Installer platform
        type: choice
        default: all
        options: [all, mac, win]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'win' && '[{"os":"windows-latest","platform":"win","arch":"x64"}]' || inputs.platform == 'mac' && '[{"os":"macos-15","platform":"mac","arch":"arm64"}]' || '[{"os":"macos-15","platform":"mac","arch":"arm64"},{"os":"windows-latest","platform":"win","arch":"x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Optional repository secrets for signed customer releases.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run desktop:prepare
      - run: npm run desktop:package -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Smoke test macOS app
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          APP='releases/desktop/mac-arm64/TriggerTerminal.app'
          node scripts/smoke-desktop.mjs "$APP/Contents/MacOS/TriggerTerminal"
      - name: Install and smoke test Windows app
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem releases/desktop/*.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'TriggerTerminalInstalled'
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Installer failed: $($installProcess.ExitCode)" }
          node scripts/smoke-desktop.mjs "$destination/TriggerTerminal.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: TriggerTerminal-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            releases/desktop/*.dmg
            releases/desktop/*.exe
          if-no-files-found: error
          retention-days: 14
